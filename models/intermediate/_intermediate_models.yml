version: 2

models:
  - name: int_subscription_daily_status
    description: >
      核心中间表。使用了 Date Spine 将用户的订阅时间（Start-End）
      展开为每日状态（Daily Grain）。
      这是计算 MRR 和 每日活跃订阅数 的基础。
      Core intermediate table. Utilizes the **Date Spine** technique to explode user 
      subscription intervals (Start-End) into a **Daily Grain**. 
      This serves as the foundation for calculating **MRR (Monthly Recurring Revenue)** and **Daily Active Subscriptions**.
    columns:
      - name: date_day
        description: "日期骨架生成的每一天Each individual date generated by the date spine."
      - name: subscription_id
        tests:
          - not_null

  - name: int_user_activity_segmentation
    description: "User segmentation based on behavioral frequency over the past 30 days (focused on the **Frequency** aspect of RFM)."
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: activity_segment
        description: "The assigned user tier: Power User, Active User, or Casual User."
